<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #333;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .github-icon {
      color: #666;
      transition: color 0.15s;
    }

    .github-icon:hover {
      color: #fff;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #888;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      background: #2a2a4a;
      border: 1px solid #3a3a5a;
      color: #888;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .btn:hover {
      background: #3a3a5a;
      color: #aaa;
    }

    .btn.active {
      background: #1e3a5f;
      border-color: #60a5fa;
      color: #60a5fa;
    }

    .kbd {
      background: #333;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-family: monospace;
      color: #888;
      margin-left: 4px;
    }

    /* Host section styles */
    .host-section {
      margin-bottom: 24px;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      overflow: hidden;
    }

    .host-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #16213e;
      cursor: pointer;
      user-select: none;
    }

    .host-header:hover {
      background: #1e2a4e;
    }

    .host-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .host-name {
      font-weight: 600;
      font-size: 16px;
    }

    .host-url {
      font-family: monospace;
      font-size: 12px;
      color: #666;
    }

    .host-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.connected { background: #4ade80; }
    .status-dot.connecting { background: #fbbf24; animation: pulse 1s infinite; }
    .status-dot.disconnected { background: #ef4444; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .host-meta {
      font-size: 11px;
      color: #666;
    }

    .collapse-icon {
      color: #666;
      transition: transform 0.2s;
    }

    .host-section.collapsed .collapse-icon {
      transform: rotate(-90deg);
    }

    .host-section.collapsed .host-content {
      display: none;
    }

    .host-content {
      padding: 0;
    }

    .host-error {
      padding: 16px;
      background: #2a1a1a;
      color: #fca5a5;
      font-size: 13px;
    }

    .host-loading {
      padding: 24px;
      text-align: center;
      color: #666;
    }

    /* Table styles */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      text-align: left;
      padding: 10px 16px;
      border-bottom: 1px solid #2a2a4a;
    }

    th {
      background: #1a1a2e;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    th:hover {
      background: #22223a;
    }

    th .sort-indicator {
      margin-left: 4px;
      opacity: 0.5;
    }

    th.sorted .sort-indicator {
      opacity: 1;
    }

    tr:hover {
      background: #1f1f3a;
    }

    .status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status.active { background: #4ade80; }
    .status.idle { background: #666; }

    .agent-id {
      font-weight: 600;
      font-family: monospace;
    }

    .branch {
      font-family: monospace;
      background: #2a2a4a;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 13px;
    }

    .pr-link {
      color: #60a5fa;
      text-decoration: none;
    }

    .pr-link:hover {
      text-decoration: underline;
    }

    .server-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .server-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #2a2a4a;
      color: #60a5fa;
      padding: 4px 10px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
      font-family: monospace;
    }

    .server-link:hover {
      background: #3a3a5a;
    }

    .server-type {
      color: #888;
      font-size: 10px;
      text-transform: uppercase;
    }

    .beads {
      font-size: 13px;
    }

    .beads-count {
      display: inline-block;
      background: #2a2a4a;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 4px;
    }

    .beads-count.in-progress {
      background: #854d0e;
      color: #fcd34d;
    }

    .beads-issues {
      font-family: monospace;
      font-size: 11px;
      color: #888;
    }

    .commit {
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #888;
      font-size: 13px;
    }

    .commit-time {
      font-size: 11px;
      color: #666;
    }

    .github-links {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .github-link {
      display: inline-block;
      background: #2a2a4a;
      color: #60a5fa;
      padding: 3px 8px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 11px;
    }

    .github-link:hover {
      background: #3a3a5a;
    }

    .github-link.diff {
      background: #1e3a5f;
      color: #93c5fd;
    }

    .github-link.diff:hover {
      background: #2d4a6f;
    }

    .no-agents {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    /* Settings modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal {
      background: #1a1a2e;
      border: 1px solid #3a3a5a;
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-bottom: 16px;
      font-size: 18px;
    }

    .modal-hosts {
      margin-bottom: 16px;
    }

    .modal-host-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .modal-host-row input {
      flex: 1;
      padding: 8px 12px;
      background: #2a2a4a;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      color: #eee;
      font-size: 14px;
    }

    .modal-host-row input:focus {
      outline: none;
      border-color: #60a5fa;
    }

    .modal-host-row .btn-remove {
      background: #4a2a2a;
      color: #fca5a5;
      border-color: #6a3a3a;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .modal-actions-right {
      display: flex;
      gap: 8px;
    }

    .btn-primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }

    .btn-primary:hover {
      background: #3b82f6;
    }

    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }

    /* Keyboard shortcuts help */
    .shortcuts-hint {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2a2a4a;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      Agent Dashboard
      <a href="https://github.com/idvorkin/agent-dashboard#readme" target="_blank" class="github-icon" title="View README on GitHub">
        <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
    </h1>
    <div class="meta">
      <div class="controls">
        <button class="btn" id="stale-toggle" onclick="toggleShowStale()">Show Stale</button>
        <button class="btn" onclick="expandAll()">Expand All <span class="kbd">e</span></button>
        <button class="btn" onclick="collapseAll()">Collapse All <span class="kbd">c</span></button>
        <button class="btn" onclick="refreshAll()">Refresh All <span class="kbd">r</span></button>
        <button class="btn" onclick="showSettings()">Settings <span class="kbd">s</span></button>
      </div>
    </div>
  </header>

  <div id="hosts-container"></div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2>Configure Hosts</h2>
      <div id="modal-hosts" class="modal-hosts"></div>
      <button class="btn" onclick="addHostRow()">+ Add Host</button>
      <p class="help-text">Enter host URLs like http://hostname:9999 or http://192.168.1.100:9999</p>
      <div class="modal-actions">
        <button class="btn" onclick="resetToDefaults()">Reset to Defaults</button>
        <div class="modal-actions-right">
          <button class="btn" onclick="hideSettings()">Cancel</button>
          <button class="btn btn-primary" onclick="saveSettings()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="shortcuts-hint">
    <span class="kbd">e</span> expand all
    <span class="kbd">c</span> collapse all
    <span class="kbd">r</span> refresh
    <span class="kbd">s</span> settings
  </div>

  <script>
    // Default hosts - c-5001 through c-5004 are tailscale hostnames
    const DEFAULT_HOSTS = [
      { name: 'c-5001', url: 'http://c-5001:9999' },
      { name: 'c-5002', url: 'http://c-5002:9999' },
      { name: 'c-5003', url: 'http://c-5003:9999' },
      { name: 'c-5004', url: 'http://c-5004:9999' },
    ];

    const STORAGE_KEY = 'agent-dashboard-hosts';
    const REFRESH_INTERVAL_CONNECTED = 10000;  // 10s when connected
    const REFRESH_INTERVAL_FAILED = 60000;     // 60s when failed

    // State
    let hosts = [];
    let hostStates = new Map(); // url -> { status, data, error, lastFetch, refreshTimer, collapsed }
    let showStale = false;
    const ONE_DAY_MS = 24 * 60 * 60 * 1000;

    // Load hosts from localStorage or use defaults
    function loadHosts() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          hosts = JSON.parse(saved);
        } else {
          hosts = [...DEFAULT_HOSTS];
        }
      } catch (e) {
        hosts = [...DEFAULT_HOSTS];
      }

      // Initialize state for each host
      hosts.forEach(host => {
        if (!hostStates.has(host.url)) {
          hostStates.set(host.url, {
            status: 'connecting',
            data: null,
            error: null,
            lastFetch: null,
            refreshTimer: null,
            collapsed: false
          });
        }
      });
    }

    function saveHosts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(hosts));
    }

    // Fetch data for a single host
    async function fetchHost(host) {
      const state = hostStates.get(host.url);
      state.status = 'connecting';
      renderHostSection(host);

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        const res = await fetch(`${host.url}/api/agents`, {
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        state.status = 'connected';
        state.data = data;
        state.error = null;
        state.lastFetch = new Date();

        // Schedule next refresh at normal interval
        scheduleRefresh(host, REFRESH_INTERVAL_CONNECTED);
      } catch (err) {
        state.status = 'disconnected';
        state.error = err.name === 'AbortError' ? 'Connection timeout' : err.message;
        state.lastFetch = new Date();

        // Schedule next refresh at slower interval
        scheduleRefresh(host, REFRESH_INTERVAL_FAILED);
      }

      renderHostSection(host);
      rerenderAllHosts(); // Reorder: connected first, disconnected last
    }

    function scheduleRefresh(host, interval) {
      const state = hostStates.get(host.url);
      if (state.refreshTimer) {
        clearTimeout(state.refreshTimer);
      }
      state.refreshTimer = setTimeout(() => fetchHost(host), interval);
    }

    // Filter stale agents
    function filterAgents(agents) {
      if (showStale) return agents;
      const now = Date.now();
      return agents.filter(agent => {
        const commitTime = (agent.lastCommitTimestamp || 0) * 1000;
        return (now - commitTime) < ONE_DAY_MS;
      });
    }

    function getHiddenCount(agents) {
      const now = Date.now();
      return agents.filter(agent => {
        const commitTime = (agent.lastCommitTimestamp || 0) * 1000;
        return (now - commitTime) >= ONE_DAY_MS;
      }).length;
    }

    function toggleShowStale() {
      showStale = !showStale;
      document.getElementById('stale-toggle').classList.toggle('active', showStale);
      document.getElementById('stale-toggle').textContent = showStale ? 'Hide Stale' : 'Show Stale';
      hosts.forEach(host => renderHostSection(host));
    }

    // Render a single host section
    function renderHostSection(host) {
      const state = hostStates.get(host.url);
      const container = document.getElementById('hosts-container');
      let section = document.getElementById(`host-${encodeURIComponent(host.url)}`);

      if (!section) {
        section = document.createElement('div');
        section.id = `host-${encodeURIComponent(host.url)}`;
        section.className = 'host-section';
        container.appendChild(section);
      }

      const statusClass = state.status;
      const statusText = state.status === 'connected' ? 'Connected' :
                        state.status === 'connecting' ? 'Connecting...' : 'Disconnected';

      const agentCount = state.data?.agents?.length || 0;
      const activeCount = state.data?.agents?.filter(a => a.status === 'active').length || 0;
      const lastFetchText = state.lastFetch ? `Last update: ${formatTime(state.lastFetch)}` : '';

      let contentHtml = '';
      if (state.status === 'connecting' && !state.data) {
        contentHtml = '<div class="host-loading">Connecting...</div>';
      } else if (state.status === 'disconnected' && !state.data) {
        contentHtml = `<div class="host-error">Failed to connect: ${state.error || 'Unknown error'}</div>`;
      } else if (state.data) {
        contentHtml = renderAgentsTable(state.data, host);
      }

      section.className = `host-section${state.collapsed ? ' collapsed' : ''}`;
      section.innerHTML = `
        <div class="host-header" onclick="toggleHost('${host.url}')">
          <div class="host-title">
            <span class="collapse-icon">&#9660;</span>
            <span class="host-name">${escapeHtml(host.name)}</span>
            <span class="host-url">${escapeHtml(host.url)}</span>
          </div>
          <div class="host-status">
            <span class="host-meta">${agentCount} repos, ${activeCount} active</span>
            <span class="host-meta">${lastFetchText}</span>
            <span class="status-dot ${statusClass}"></span>
            <span>${statusText}</span>
          </div>
        </div>
        <div class="host-content">
          ${contentHtml}
        </div>
      `;
    }

    function renderAgentsTable(data, host) {
      const agents = data.agents || [];
      if (agents.length === 0) {
        return '<div class="no-agents">No repositories found</div>';
      }

      const filteredAgents = filterAgents(agents);
      const hiddenCount = getHiddenCount(agents);

      if (filteredAgents.length === 0) {
        return `<div class="no-agents">No recent repos (${hiddenCount} stale repos hidden)</div>`;
      }

      // Sort by last commit timestamp descending
      const sortedAgents = [...filteredAgents].sort((a, b) =>
        (b.lastCommitTimestamp || 0) - (a.lastCommitTimestamp || 0)
      );

      const rows = sortedAgents.map(agent => {
        const statusClass = agent.status;
        const serversHtml = agent.servers.length > 0
          ? agent.servers.map(s => {
              const url = data.tailscaleHostname ? s.tailscaleUrl : s.url;
              return `<a class="server-link" href="${url}" target="_blank">
                <span class="server-type">${s.type}</span>
                :${s.port}
              </a>`;
            }).join('')
          : '<span style="color: #666">-</span>';

        const prHtml = agent.pr
          ? `<a class="pr-link" href="${agent.pr.url}" target="_blank">#${agent.pr.number}</a>`
          : '<span style="color: #666">-</span>';

        const beadsHtml = agent.beads
          ? `<span class="beads-count${agent.beads.inProgress > 0 ? ' in-progress' : ''}">${agent.beads.open} open</span>
             ${agent.beads.inProgress > 0 ? `<span class="beads-count in-progress">${agent.beads.inProgress} WIP</span>` : ''}`
          : '<span style="color: #666">-</span>';

        return `
          <tr>
            <td>
              <span class="status ${statusClass}"></span>
              <span class="agent-id">${escapeHtml(agent.id)}</span>
            </td>
            <td><span class="branch">${escapeHtml(agent.branch)}</span></td>
            <td>${prHtml}</td>
            <td><div class="server-links">${serversHtml}</div></td>
            <td class="beads">${beadsHtml}</td>
            <td>
              <div class="commit" title="${escapeHtml(agent.lastCommit || '')}">${escapeHtml(agent.lastCommit || '-')}</div>
              <div class="commit-time">${escapeHtml(agent.lastCommitTime || '')}</div>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <table>
          <thead>
            <tr>
              <th>Agent</th>
              <th>Branch</th>
              <th>PR</th>
              <th>Servers</th>
              <th>Beads</th>
              <th>Last Commit</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    // Toggle host collapse
    function toggleHost(url) {
      const state = hostStates.get(url);
      if (state) {
        state.collapsed = !state.collapsed;
        const host = hosts.find(h => h.url === url);
        if (host) renderHostSection(host);
      }
    }

    function expandAll() {
      hosts.forEach(host => {
        const state = hostStates.get(host.url);
        if (state) state.collapsed = false;
        renderHostSection(host);
      });
    }

    function collapseAll() {
      hosts.forEach(host => {
        const state = hostStates.get(host.url);
        if (state) state.collapsed = true;
        renderHostSection(host);
      });
    }

    function refreshAll() {
      hosts.forEach(host => fetchHost(host));
    }

    // Settings modal
    function showSettings() {
      const modal = document.getElementById('settings-modal');
      const container = document.getElementById('modal-hosts');
      container.innerHTML = '';

      hosts.forEach((host, i) => {
        addHostRowToModal(host.name, host.url);
      });

      modal.classList.remove('hidden');
    }

    function hideSettings() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function addHostRow() {
      addHostRowToModal('', '');
    }

    function addHostRowToModal(name, url) {
      const container = document.getElementById('modal-hosts');
      const row = document.createElement('div');
      row.className = 'modal-host-row';
      row.innerHTML = `
        <input type="text" placeholder="Name (e.g., macbook)" value="${escapeHtml(name)}" class="host-name-input">
        <input type="text" placeholder="URL (e.g., http://hostname:9999)" value="${escapeHtml(url)}" class="host-url-input">
        <button class="btn btn-remove" onclick="this.parentElement.remove()">Remove</button>
      `;
      container.appendChild(row);
    }

    function saveSettings() {
      const rows = document.querySelectorAll('.modal-host-row');
      const newHosts = [];

      rows.forEach(row => {
        const name = row.querySelector('.host-name-input').value.trim();
        const url = row.querySelector('.host-url-input').value.trim();
        if (name && url) {
          newHosts.push({ name, url });
        }
      });

      if (newHosts.length === 0) {
        alert('Please add at least one host');
        return;
      }

      // Clear old timers
      hostStates.forEach(state => {
        if (state.refreshTimer) clearTimeout(state.refreshTimer);
      });

      // Update hosts
      hosts = newHosts;
      saveHosts();

      // Reset states for new hosts
      const newStates = new Map();
      hosts.forEach(host => {
        const existing = hostStates.get(host.url);
        newStates.set(host.url, existing || {
          status: 'connecting',
          data: null,
          error: null,
          lastFetch: null,
          refreshTimer: null,
          collapsed: false
        });
      });
      hostStates = newStates;

      // Re-render and fetch
      document.getElementById('hosts-container').innerHTML = '';
      hosts.forEach(host => {
        renderHostSection(host);
        fetchHost(host);
      });

      hideSettings();
    }

    function resetToDefaults() {
      const container = document.getElementById('modal-hosts');
      container.innerHTML = '';
      DEFAULT_HOSTS.forEach(host => {
        addHostRowToModal(host.name, host.url);
      });
    }

    // Utilities
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
    }

    function formatTime(date) {
      const now = new Date();
      const diff = Math.floor((now - date) / 1000);
      if (diff < 60) return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      return date.toLocaleTimeString();
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Don't trigger shortcuts when typing in inputs
      if (e.target.tagName === 'INPUT') return;

      switch (e.key.toLowerCase()) {
        case 'e':
          expandAll();
          break;
        case 'c':
          collapseAll();
          break;
        case 'r':
          refreshAll();
          break;
        case 's':
          showSettings();
          break;
        case 'escape':
          hideSettings();
          break;
      }
    });

    // Sort hosts by connection status (connected first, disconnected last)
    function getSortedHosts() {
      return [...hosts].sort((a, b) => {
        const stateA = hostStates.get(a.url);
        const stateB = hostStates.get(b.url);
        const orderA = stateA?.status === 'connected' ? 0 : stateA?.status === 'connecting' ? 1 : 2;
        const orderB = stateB?.status === 'connected' ? 0 : stateB?.status === 'connecting' ? 1 : 2;
        return orderA - orderB;
      });
    }

    // Re-render all hosts in sorted order
    function rerenderAllHosts() {
      const container = document.getElementById('hosts-container');
      const sorted = getSortedHosts();

      // Reorder DOM elements
      sorted.forEach(host => {
        const section = document.getElementById(`host-${encodeURIComponent(host.url)}`);
        if (section) {
          container.appendChild(section);
        }
      });
    }

    // Initialize
    loadHosts();
    hosts.forEach(host => {
      renderHostSection(host);
      fetchHost(host);
    });

    // Live reload - listen for server file changes
    const liveReload = new EventSource('/api/live-reload');
    liveReload.onmessage = () => {
      console.log('File changed, reloading...');
      location.reload();
    };
  </script>
</body>
</html>
